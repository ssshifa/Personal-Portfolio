<section class="contact">

<div class="heading">

<h1>Contact Me</h1>

<div class="contact-icon">

<i class="fas fa-paper-plane"></i>

</div>

</div>



<div class="contact-container">



<div class="contact-info">

<div class="info-box">

<i class="fas fa-envelope"></i>

<h3>Email</h3>

<p>shifasaimasadia@gmail.com</p>

</div>



<div class="info-box">

<i class="fas fa-phone"></i>

<h3>Phone</h3>

<p>+880 1XXXXXXXXX</p>

</div>



<div class="info-box">

<i class="fas fa-location-dot"></i>

<h3>Location</h3>

<p>Chattogram, Bangladesh</p>

</div>



<div class="social-icons">

<a href="#"><i class="fab fa-facebook-f"></i></a>

<a href="#"><i class="fab fa-linkedin-in"></i></a>

<a href="#"><i class="fab fa-github"></i></a>

</div>

</div>


<div class="contact-form">

<form
action="https://formsubmit.co/shifasaimasadia@gmail.com"
method="POST">

<input
type="text"
name="name"
placeholder="Your Name"
required>

<input
type="email"
name="email"
placeholder="Your Email"
required>

<input
type="text"
name="subject"
placeholder="Subject">

<textarea
name="message"
rows="6"
placeholder="Your Message"
required></textarea>


<!-- Hidden Settings -->

<input
type="hidden"
name="_subject"
value="New Portfolio Contact Form">

<input
type="hidden"
name="_captcha"
value="false">

<input
type="hidden"
name="_template"
value="table">

<input
type="hidden"
name="_autoresponse"
value="Thank you for contacting me. I have received your message and will get back to you soon.">


<button type="submit">

Send Message

</button>

</form>

</div>



</div>
